# SRTCreator CI / release (modular_proposal.md §12).
#
# Three jobs mirror the split build:
#   whisper-dlls  heavy, cached by submodule SHA - builds the coherent backend-DL
#                 DLL set (CPU+CUDA+Vulkan) with the CUDA Toolkit + Vulkan SDK.
#   app           fast, MSVC-only - fetches FFmpeg/ONNX, consumes the whisper DLLs,
#                 builds srt.exe/srtgui.exe, assembles the tiered zips.
#   release       on a version tag - publishes the zips + notices as a GitHub Release.
#
# HARD LIMITATION (§12.3): GitHub-hosted runners have NO GPU, so CI compiles and
# packages the CUDA/Vulkan DLLs but cannot functionally test them on a GPU. The
# app job runs a CPU-only smoke test; GPU validation (the Phase-2a Vulkan gate,
# CUDA correctness) is a manual sign-off or a self-hosted GPU runner before publish.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual runs (builds + packages, no publish)

env:
  CUDA_VERSION: "13.0.0"
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  # ---------------------------------------------------------------------------
  whisper-dlls:
    runs-on: windows-2022
    steps:
      # whisper.cpp has deep example paths (android/swiftui) that exceed Windows'
      # 260-char limit on some checkouts; enable long paths before cloning.
      - name: Enable git long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cache the staged DLL set by the whisper submodule SHA + the build flags.
      # A cache hit skips the 20-40 min CUDA-kernel compile entirely.
      - name: Cache whisper DLLs
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: third_party/whisper
          key: whisper-dlls-${{ hashFiles('.gitmodules') }}-${{ hashFiles('third_party/whisper.cpp/CMakeLists.txt') }}-cuda${{ env.CUDA_VERSION }}-vk${{ env.VULKAN_SDK_VERSION }}-v1

      - name: Resolve whisper submodule SHA
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        shell: pwsh
        run: git -C third_party/whisper.cpp rev-parse HEAD

      - name: Install CUDA Toolkit
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","nvrtc","nvrtc_dev","visual_studio_integration"]'

      - name: Install Vulkan SDK
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - name: Build whisper backend DLLs
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:CUDA_PATH = $env:CUDA_PATH  # set by the toolkit action
          ./scripts/build-whisper-dlls.ps1 -Jobs 4

      - name: Upload whisper DLLs artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-dlls
          path: third_party/whisper
          retention-days: 7

  # ---------------------------------------------------------------------------
  app:
    needs: whisper-dlls
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch FFmpeg + ONNX/DirectML (pinned)
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Download whisper DLLs
        uses: actions/download-artifact@v4
        with:
          name: whisper-dlls
          path: third_party/whisper

      - name: Build (MSVC only)
        shell: cmd
        run: build.bat

      - name: CPU smoke test (no GPU on hosted runners)
        shell: pwsh
        run: |
          # A hosted runner has no GPU, so this exercises the CPU backend / DLL
          # loading path only. GPU correctness is a separate manual/self-hosted gate.
          ./build/srt.exe --help
          if ($LASTEXITCODE -ne 0) { throw "srt.exe --help failed" }

      # Version = the tag (v1.2.3 -> 1.2.3) on a tag build, else dependencies.json
      # app.version for manual/dispatch runs. This makes the zip names match the tag.
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = (Get-Content dependencies.json -Raw | ConvertFrom-Json).app.version
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Packaging version $v"

      - name: Package tiered zips
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## SRTCreator ${{ github.ref_name }}

            Generate an `.srt` subtitle file from any movie file, GPU-accelerated.

            ### Downloads
            | Download | For | Notes |
            |---|---|---|
            | **`...-base.zip`** | Everyone - start here | Universal win64. CPU transcription + DirectML vocal isolation. Self-contained (VC++ runtime included). |
            | **`...-cuda-pack.zip`** | NVIDIA GPUs | Unzip **into the base folder** for fast CUDA transcription. Needs only an NVIDIA driver. |
            | **`...-vulkan-pack.zip`** | Any modern GPU | Unzip **into the base folder** for GPU transcription on NVIDIA/AMD/Intel. Needs only a recent GPU driver. |

            ### Install
            1. Download and unzip **`...-base.zip`**.
            2. (Optional) For GPU speed, unzip one GPU pack **into the same folder** - the app auto-selects it (CUDA → Vulkan → CPU).
            3. Run `srt.exe "your.movie.mkv"` (CLI) or `srtgui.exe` (drag-and-drop). See `GETTING-STARTED.txt`.

            ### Models (not bundled - downloaded on first run)
            ASR / vocal-isolation weights are fetched automatically on first use into
            `%LOCALAPPDATA%\SRTCreator\models` (default `large-v3-turbo-q8_0`, ~830 MB;
            requires an internet connection). Pre-fetch with `srt.exe --download large-v3-turbo-q8_0`.

            ### Licensing
            SRTCreator is Apache-2.0 (`LICENSE`). Bundled third-party components and their
            licenses are listed in `NOTICE` / `LICENSES\`. Pinned component versions are in
            `dependencies.json`.

            > GPU backends are compiled + packaged by CI but validated on GPU hardware via a
            > separate manual/self-hosted gate (hosted runners have no GPU).
